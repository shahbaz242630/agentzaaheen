name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1" # weekly: catch new advisories even when nothing changes
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GITLEAKS_VERSION: "8.30.1"
  GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
  UV_LOCKED: "1"

jobs:
  quality:
    name: quality (lint, types, boundaries, tests, gate proofs)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: false
      - name: Install dependencies (exact lockfile)
        run: uv sync --locked
      - name: Path guard (code only, ADR-014)
        run: uv run python -m tools.path_guard --tracked
      - name: Lint
        run: uv run ruff check .
      - name: Format
        run: uv run ruff format --check .
      - name: Types (mypy --strict)
        run: uv run mypy
      - name: Module boundaries
        run: uv run lint-imports
      - name: Start throwaway Postgres (same hardened container as on the laptop)
        run: uv run python -m tools.dev_db up
      - name: Tests (database tests must run here, never skip)
        env:
          AGENTZAAHEEN_REQUIRE_DB: "1"
        run: uv run pytest
      - name: Coverage floors per file
        run: uv run python -m tools.coverage_gate
      - name: Install gitleaks (checksum verified)
        run: |
          curl -fsSL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf gitleaks.tar.gz -C "$RUNNER_TEMP/bin" gitleaks
          rm gitleaks.tar.gz
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Gate proofs (every check must still fail on broken input)
        run: uv run python -m tools.gate_proofs --require-gitleaks

  dashboard:
    name: dashboard (types, lint, tests, build, known vulnerabilities)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/dashboard
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Install dependencies (exact lockfile, no install scripts)
        run: npm ci --ignore-scripts
      - name: Types (strict)
        run: npm run typecheck
      - name: Lint (no any, no ts-ignore, no raw HTML)
        run: npm run lint
      - name: Tests (against the API's contract fixture)
        run: npm test
      - name: Build
        run: npx vite build
      - name: Built page has no inline script or style (strict CSP)
        run: |
          if grep -Eq '<script(>| [^>]*>[^<])|<style' dist/index.html; then
            echo "dist/index.html has inline script or style, which the CSP blocks"
            exit 1
          fi
      - name: Known vulnerabilities in dependencies
        run: npm audit --audit-level=low

  checker:
    name: checker (types, lint, tests, known vulnerabilities)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/checker
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Install dependencies (exact lockfile, no install scripts)
        run: npm ci --ignore-scripts
      - name: Types (strict)
        run: npm run typecheck
      - name: Lint (no any, no ts-ignore)
        run: npm run lint
      - name: Tests (pretend internet, clock and database)
        run: npm test
      - name: Known vulnerabilities in dependencies
        run: npm audit --audit-level=low

  secrets:
    name: secrets (full history scan)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install gitleaks (checksum verified)
        run: |
          curl -fsSL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          rm gitleaks.tar.gz
      - name: Scan every commit
        run: ./gitleaks git . --redact --no-banner --exit-code 1

  supply-chain:
    name: supply chain (vulnerable dependencies, insecure code patterns)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: false
      - run: uv sync --locked
      - name: Known vulnerabilities in dependencies (exact lockfile, hashes required)
        run: |
          uv export --locked --no-emit-project --format requirements-txt -o "$RUNNER_TEMP/req.audit.txt" -q
          uv run pip-audit -r "$RUNNER_TEMP/req.audit.txt" --disable-pip --require-hashes --strict
      - name: Insecure code patterns in product code (bandit, all severities)
        run: uv run bandit -c pyproject.toml -r src -q
      - name: Insecure code patterns in dev tools (bandit, medium and above; tools run fixed commands by design)
        run: uv run bandit -c pyproject.toml -r tools -q -ll

  workflow-security:
    name: workflow security (zizmor)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: false
      - name: Audit GitHub workflows
        run: uvx zizmor@1.30.1 --offline --min-severity low .github/workflows

  dependency-review:
    name: dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
