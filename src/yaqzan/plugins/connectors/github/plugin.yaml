id: github
type: connector
version: 0.4.0
sdk: ">=1.12,<2"
permissions: [read]
egress: [api.github.com, "productionresultssa<n>.blob.core.windows.net"]
endpoints:
  - GET /repos/{owner}/{repo}
  - GET /repos/{owner}/{repo}/actions/runs
  - GET /search/issues
  - GET /repos/{owner}/{repo}/actions/runs/{run_id}/jobs
  - GET /repos/{owner}/{repo}/actions/jobs/{job_id}/logs
  - GET /repos/{owner}/{repo}/git/trees/{branch}
  - GET /repos/{owner}/{repo}/contents/{path}
  - GET /user/repos
  - GET /repos/{owner}/{repo}/languages
credentials:
  - name: token
    scope_hint: "fine-grained, read-only: contents, issues, pull requests, actions, metadata; chosen repositories only"
    verify: true
data_class: internal
interface:
  display_name: GitHub
  category: Code
  description: "Issue, pull request and build counts; a failed build's log on demand; the scout's files (untrusted); and a project's languages and providers, found by code."
