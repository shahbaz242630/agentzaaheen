id: paddle
type: connector
version: 0.1.0
sdk: ">=1.2,<2"
permissions: [read]
egress: [api.paddle.com, sandbox-api.paddle.com]
endpoints:
  - GET /subscriptions
  - GET /transactions
  - GET /adjustments
  - GET /discounts
credentials:
  - name: api_key
    scope_hint: "read-only: subscriptions, transactions, adjustments, discounts"
    verify: true
data_class: internal
interface:
  display_name: Paddle
  category: Revenue
  description: "Subscriptions, payments and refunds, read-only: MRR, subscribers, trials, failed payments."
