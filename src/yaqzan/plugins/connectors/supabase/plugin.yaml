id: supabase
type: connector
version: 0.1.0
sdk: ">=1.8,<2"
permissions: [read]
egress: [api.supabase.com]
endpoints:
  - GET /v1/projects/{ref}
  - GET /v1/projects/{ref}/health
  - GET /v1/projects/{ref}/config/disk/util
  - GET /v1/projects/{ref}/analytics/endpoints/usage.api-counts
credentials:
  - name: token
    scope_hint: "scoped personal access token, Read only: Project Settings, Disk Config, Usage Analytics; chosen projects only; never Database or API Key Secrets"
    verify: true
data_class: internal
interface:
  display_name: Supabase
  category: Backend
  description: "Each backend project's state, service health, disk use and API traffic: codes and numbers only, never data or messages."
