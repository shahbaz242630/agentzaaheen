id: healthchecks
type: connector
version: 0.1.0
sdk: ">=1.13,<2"
permissions: [read]
egress: [healthchecks.io]
endpoints:
  - GET /api/v3/checks/
credentials:
  - name: key
    scope_hint: "project API key, read-only (Settings > API Access: \"read-only\"); it can never ping, pause or change a check"
    verify: true
data_class: internal
interface:
  display_name: Healthchecks
  category: Monitoring
  description: "Each check's short name, status and last ping: never its name, notes or ping address."
