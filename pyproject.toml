[project]
name = "agentzaaheen"
version = "0.0.1"
description = "Agent Zaaheen: an AI operations team that watches a portfolio of products 24/7."
requires-python = ">=3.12"
# No licence: all rights reserved (ADR-013).
dependencies = [
    "asyncpg==0.32.0",
    "cryptography==50.0.2",
    "fastapi==0.143.0",
    "httpx==0.28.1",
    "opentelemetry-api==1.45.1",
    "opentelemetry-sdk==1.45.1",
    "pydantic==2.14.1",
    "pyyaml==6.0.3",
    "structlog==26.1.0",
    "tzdata==2026.5",  # time zones on Windows (the 07:00 briefing is in the Chairman's zone)
    "uvicorn==0.54.0",
    "webauthn==3.0.1",
]

[dependency-groups]
dev = [
    "asyncpg-stubs==0.32.0",
    "bandit==1.9.4",
    "hypothesis==6.169.0",
    "import-linter==2.15",
    "mypy==2.4.0",
    "pip-audit==2.10.1",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "ruff==0.17.0",
    "types-pyyaml==6.0.12.20260906",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentzaaheen"]

[tool.uv]
# Supply-chain cooldown (Rulebook §4): never resolve releases newer than this.
# Move it forward deliberately, never to "today".
exclude-newer = "2026-10-14T00:00:00Z"
# Deliberate exceptions; drop each once the cooldown passes it:
# - certifi 2026.10.19 removes root CAs whose intermediate keys were compromised
#   (GHSA-6q48-6c7w-9gw2, critical, 20 Oct 2026).
# - filelock 4.2.1 (17 Oct) fixes six advisories in 4.1.1 (CVE-2026-112906 and five more,
#   24 Oct 2026). Dev-only: pulled in by pip-audit's cache.
exclude-newer-package = { certifi = "2026-10-20T12:00:00Z", filelock = "2026-10-17T17:00:00Z" }

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests", "tools"]
extend-exclude = ["tests/gate_proofs/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "BLE", "A", "C4", "SIM", "PT", "RET", "ARG", "PL", "RUF", "T20", "N", "ANN", "D", "DTZ"]
ignore = [
    "D203", "D213",          # pick one docstring style
    "D105", "D107",          # magic methods / __init__ docstrings optional
    "PLR2004",               # magic values in comparisons are fine in tests
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "S101", "D", "ANN", "PLR2004",
    "S105", "S106",          # tests plant fake secrets on purpose (canaries)
    "ARG001", "ARG002", "ARG005",  # test doubles match a signature and may ignore arguments
    "PLR0913", "PLR0917",    # fixture builders take one argument per field they vary
]
"tools/**" = ["T201"]
# A past migration's SQL is frozen history: its text (under the old name) must match what was recorded.
"src/agentzaaheen/core/store/migrations/m0*.py" = ["E501"]

[tool.ruff.lint.pydocstyle]
convention = "google"

# ---------------------------------------------------------------- mypy
[tool.mypy]
strict = true
python_version = "3.12"
mypy_path = "src"
files = ["src", "tools", "tests"]
explicit_package_bases = true
plugins = ["pydantic.mypy"]
exclude = ["tests/gate_proofs/fixtures/"]

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers --cov=agentzaaheen --cov=tools --cov-branch --cov-report=term-missing --cov-report=json"
norecursedirs = [".*", "*.egg", "build", "dist", "node_modules", ".venv", "tests/gate_proofs/fixtures"]
filterwarnings = [
    "error",
    # Starlette 1.8 asks for its httpx fork in the test client; plain httpx still works (tests only).
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]

[tool.coverage.run]
branch = true
# The proof runner is itself exercised on every CI run (job "gate proofs").
omit = ["tools/gate_proofs.py"]

[tool.coverage.report]
exclude_also = ["if __name__ == .__main__.:"]

# ---------------------------------------------------------------- import-linter
# Module boundaries (Rulebook §2.2). CI fails if any of these break.
[tool.importlinter]
root_package = "agentzaaheen"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "The core never imports a plugin"
type = "forbidden"
source_modules = ["agentzaaheen.core"]
forbidden_modules = ["agentzaaheen.plugins"]

[[tool.importlinter.contracts]]
name = "Plugins depend only on the SDK, never on core internals"
type = "forbidden"
source_modules = ["agentzaaheen.plugins"]
forbidden_modules = [
    "agentzaaheen.core.api", "agentzaaheen.core.store", "agentzaaheen.core.scheduler", "agentzaaheen.core.runner",
    "agentzaaheen.core.policy", "agentzaaheen.core.llm_gateway", "agentzaaheen.core.vault", "agentzaaheen.core.detector",
    "agentzaaheen.core.metrics", "agentzaaheen.core.notify", "agentzaaheen.core.voice", "agentzaaheen.core.net",
    "agentzaaheen.core.broker", "agentzaaheen.core.registry", "agentzaaheen.core.auth",
]

[[tool.importlinter.contracts]]
name = "The SDK is the bottom layer: it imports no other core module"
type = "forbidden"
source_modules = ["agentzaaheen.core.sdk"]
forbidden_modules = [
    "agentzaaheen.core.api", "agentzaaheen.core.store", "agentzaaheen.core.scheduler", "agentzaaheen.core.runner",
    "agentzaaheen.core.policy", "agentzaaheen.core.llm_gateway", "agentzaaheen.core.vault", "agentzaaheen.core.detector",
    "agentzaaheen.core.metrics", "agentzaaheen.core.notify", "agentzaaheen.core.voice", "agentzaaheen.core.net",
    "agentzaaheen.core.broker", "agentzaaheen.core.registry", "agentzaaheen.core.auth",
]

[[tool.importlinter.contracts]]
name = "Plugin families are independent of each other"
type = "independence"
modules = [
    "agentzaaheen.plugins.connectors", "agentzaaheen.plugins.agents",
    "agentzaaheen.plugins.skills", "agentzaaheen.plugins.detectors",
]

[[tool.importlinter.contracts]]
name = "Only the vault may see secrets; nothing else imports it except the policy layer"
type = "forbidden"
source_modules = [
    "agentzaaheen.core.api", "agentzaaheen.core.runner", "agentzaaheen.core.scheduler", "agentzaaheen.core.detector",
    "agentzaaheen.core.metrics", "agentzaaheen.core.notify", "agentzaaheen.core.voice", "agentzaaheen.core.store",
]
forbidden_modules = ["agentzaaheen.core.vault"]

[[tool.importlinter.contracts]]
name = "Only the vault uses cryptography (no DIY crypto elsewhere, SP-7)"
type = "forbidden"
source_modules = [
    "agentzaaheen.core.api", "agentzaaheen.core.store", "agentzaaheen.core.scheduler", "agentzaaheen.core.runner",
    "agentzaaheen.core.policy", "agentzaaheen.core.llm_gateway", "agentzaaheen.core.detector", "agentzaaheen.core.metrics",
    "agentzaaheen.core.notify", "agentzaaheen.core.voice", "agentzaaheen.core.sdk", "agentzaaheen.plugins",
    "agentzaaheen.core.registry", "agentzaaheen.core.auth",
    "agentzaaheen.core.telemetry",
]
forbidden_modules = ["cryptography"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Only the SDK's redacting logger uses structlog (one logger, SECURITY 9)"
type = "forbidden"
source_modules = [
    "agentzaaheen.core.api", "agentzaaheen.core.store", "agentzaaheen.core.scheduler", "agentzaaheen.core.runner",
    "agentzaaheen.core.policy", "agentzaaheen.core.llm_gateway", "agentzaaheen.core.vault", "agentzaaheen.core.detector",
    "agentzaaheen.core.metrics", "agentzaaheen.core.notify", "agentzaaheen.core.voice", "agentzaaheen.plugins",
    "agentzaaheen.core.registry", "agentzaaheen.core.auth",
    "agentzaaheen.core.telemetry",
]
forbidden_modules = ["structlog"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "The store sits below everything but the SDK (Rulebook 2.2: dependencies point one way)"
type = "forbidden"
source_modules = ["agentzaaheen.core.store"]
forbidden_modules = [
    "agentzaaheen.core.api", "agentzaaheen.core.scheduler", "agentzaaheen.core.runner", "agentzaaheen.core.policy",
    "agentzaaheen.core.llm_gateway", "agentzaaheen.core.vault", "agentzaaheen.core.detector", "agentzaaheen.core.metrics",
    "agentzaaheen.core.notify", "agentzaaheen.core.voice", "agentzaaheen.core.net",
    "agentzaaheen.core.broker",
]

[[tool.importlinter.contracts]]
name = "Only the store talks to the database driver (nothing else reads tables, Rulebook 2.2)"
type = "forbidden"
source_modules = [
    "agentzaaheen.core.api", "agentzaaheen.core.scheduler", "agentzaaheen.core.runner", "agentzaaheen.core.policy",
    "agentzaaheen.core.llm_gateway", "agentzaaheen.core.vault", "agentzaaheen.core.detector", "agentzaaheen.core.metrics",
    "agentzaaheen.core.notify", "agentzaaheen.core.voice", "agentzaaheen.core.sdk", "agentzaaheen.plugins",
    "agentzaaheen.core.registry", "agentzaaheen.core.auth",
    "agentzaaheen.core.telemetry",
]
forbidden_modules = ["asyncpg"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Only the network module talks HTTP (one outbound client with an allowlist, SECURITY NET-1)"
type = "forbidden"
source_modules = [
    "agentzaaheen.core.api", "agentzaaheen.core.store", "agentzaaheen.core.scheduler", "agentzaaheen.core.runner",
    "agentzaaheen.core.policy", "agentzaaheen.core.llm_gateway", "agentzaaheen.core.vault", "agentzaaheen.core.detector",
    "agentzaaheen.core.metrics", "agentzaaheen.core.notify", "agentzaaheen.core.voice", "agentzaaheen.core.sdk", "agentzaaheen.plugins",
    "agentzaaheen.core.registry", "agentzaaheen.core.auth",
    "agentzaaheen.core.telemetry",
]
forbidden_modules = ["httpx", "httpcore", "urllib3", "http", "socket", "ssl"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Only the API serves the web (one place with routes, headers and the host allowlist)"
type = "forbidden"
source_modules = [
    "agentzaaheen.core.store", "agentzaaheen.core.scheduler", "agentzaaheen.core.runner", "agentzaaheen.core.policy",
    "agentzaaheen.core.llm_gateway", "agentzaaheen.core.vault", "agentzaaheen.core.detector", "agentzaaheen.core.metrics",
    "agentzaaheen.core.notify", "agentzaaheen.core.voice", "agentzaaheen.core.net", "agentzaaheen.core.broker",
    "agentzaaheen.core.sdk", "agentzaaheen.plugins",
    "agentzaaheen.core.registry", "agentzaaheen.core.auth",
    "agentzaaheen.core.telemetry",
]
forbidden_modules = ["fastapi", "starlette", "uvicorn"]

[[tool.importlinter.contracts]]
name = "The network module never opens credentials: keys reach it only as secret headers"
type = "forbidden"
source_modules = ["agentzaaheen.core.net"]
forbidden_modules = ["agentzaaheen.core.broker"]

[[tool.importlinter.contracts]]
name = "Metrics are pure code over SDK shapes: no database, network, policy or plugins"
type = "forbidden"
source_modules = ["agentzaaheen.core.metrics"]
forbidden_modules = [
    "agentzaaheen.core.api", "agentzaaheen.core.store", "agentzaaheen.core.scheduler", "agentzaaheen.core.runner",
    "agentzaaheen.core.policy", "agentzaaheen.core.llm_gateway", "agentzaaheen.core.vault", "agentzaaheen.core.detector",
    "agentzaaheen.core.notify", "agentzaaheen.core.voice", "agentzaaheen.core.net",
    "agentzaaheen.core.broker",
]

[[tool.importlinter.contracts]]
name = "The registry only reads files: no database, network, vault, policy or web (ADR-027)"
type = "forbidden"
source_modules = ["agentzaaheen.core.registry"]
forbidden_modules = [
    "agentzaaheen.core.api", "agentzaaheen.core.store", "agentzaaheen.core.scheduler", "agentzaaheen.core.runner",
    "agentzaaheen.core.policy", "agentzaaheen.core.llm_gateway", "agentzaaheen.core.vault", "agentzaaheen.core.detector",
    "agentzaaheen.core.metrics", "agentzaaheen.core.notify", "agentzaaheen.core.voice", "agentzaaheen.core.net",
    "agentzaaheen.core.broker",
