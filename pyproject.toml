[[tool.importlinter.contracts]]
name = "Passkeys only check signatures: no database, network, vault, policy or web (ADR-SEC-007)"
type = "forbidden"
source_modules = ["agentzaaheen.core.auth"]
forbidden_modules = [
    "agentzaaheen.core.api", "agentzaaheen.core.store", "agentzaaheen.core.scheduler", "agentzaaheen.core.runner",
    "agentzaaheen.core.policy", "agentzaaheen.core.llm_gateway", "agentzaaheen.core.vault", "agentzaaheen.core.detector",
    "agentzaaheen.core.metrics", "agentzaaheen.core.notify", "agentzaaheen.core.voice", "agentzaaheen.core.net",
    "agentzaaheen.core.broker", "agentzaaheen.core.registry",
]

[[tool.importlinter.contracts]]
name = "Only the auth module speaks WebAuthn (one place checks passkeys, ADR-SEC-007)"
type = "forbidden"
source_modules = [
    "agentzaaheen.core.api", "agentzaaheen.core.store", "agentzaaheen.core.scheduler", "agentzaaheen.core.runner",
    "agentzaaheen.core.policy", "agentzaaheen.core.llm_gateway", "agentzaaheen.core.vault", "agentzaaheen.core.detector",
    "agentzaaheen.core.metrics", "agentzaaheen.core.notify", "agentzaaheen.core.voice", "agentzaaheen.core.net",
    "agentzaaheen.core.broker", "agentzaaheen.core.registry", "agentzaaheen.core.sdk", "agentzaaheen.plugins",
    "agentzaaheen.core.telemetry",
]
forbidden_modules = ["webauthn"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Only the SDK and telemetry touch OpenTelemetry (others use core.sdk.span, ADR-032)"
type = "forbidden"
source_modules = [
    "agentzaaheen.core.api", "agentzaaheen.core.store", "agentzaaheen.core.scheduler", "agentzaaheen.core.runner",
    "agentzaaheen.core.policy", "agentzaaheen.core.llm_gateway", "agentzaaheen.core.vault", "agentzaaheen.core.detector",
